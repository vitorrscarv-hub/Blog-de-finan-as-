name: Rotinas de dados

# Rotinas sem IA: leem fontes oficiais (Banco Central e IBGE) e abrem pull request só quando há mudança.
# Os horários são UTC (Brasília = UTC-3). Cada rotina roda só na hora em que a fonte publica:
#   dolar   13h20 e 13h50, dias úteis: nota da PTAX depois da divulgação do fechamento (por volta das 13h10)
#   copom   18h50 e 19h50 nas quartas: a decisão do Copom sai por volta das 18h30
#   ibge    9h25 a 12h25, dias úteis: só age se o calendário do IBGE marcar uma divulgação nas últimas 3 horas
#   agenda  segunda, 6h05: renova o calendário de divulgações (src/data/agenda.json)
# Pré-requisito: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: '20 16 * * 1-5'
    - cron: '50 16 * * 1-5'
    - cron: '50 21 * * 3'
    - cron: '50 22 * * 3'
    - cron: '25 12-15 * * 1-5'
    - cron: '5 9 * * 1'
  workflow_dispatch:
    inputs:
      rotina:
        description: 'Qual rotina rodar agora'
        type: choice
        options: [dolar, copom, ibge, agenda]
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  ASTRO_TELEMETRY_DISABLED: 1
  GH_TOKEN: ${{ github.token }}

jobs:
  dolar:
    if: (github.event_name == 'workflow_dispatch' && inputs.rotina == 'dolar') || github.event.schedule == '20 16 * * 1-5' || github.event.schedule == '50 16 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: rotina-dolar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - id: nota
        run: |
          node scripts/dolar-diario.mjs | tee saida.txt
          node scripts/indicadores.mjs --so=ptax
          echo "data=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Validar o site com a nota nova
        run: |
          if [ -n "$(git status --porcelain src)" ]; then npm ci && npm run build; fi
      - name: Abrir pull request
        run: |
          scripts/abrir-pr.sh "rotina/dolar-${{ steps.nota.outputs.data }}" "Nota do dólar PTAX de ${{ steps.nota.outputs.data }}" "Nota gerada por modelo a partir do fechamento da PTAX (Banco Central), sem IA. Revise e faça o merge para publicar."

  copom:
    if: (github.event_name == 'workflow_dispatch' && inputs.rotina == 'copom') || github.event.schedule == '50 21 * * 3' || github.event.schedule == '50 22 * * 3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: rotina-copom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: selic
        run: |
          node scripts/indicadores.mjs --so=selic | tee saida.txt
          echo "reuniao=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Abrir pull request
        run: |
          scripts/abrir-pr.sh "rotina/selic-${{ steps.selic.outputs.reuniao }}" "Selic atualizada após decisão do Copom" "A meta Selic da faixa de indicadores mudou na fonte do Banco Central (historicotaxasjuros). Se quiser matéria sobre a decisão, peça uma Matéria indicada pontual."

  ibge:
    if: (github.event_name == 'workflow_dispatch' && inputs.rotina == 'ibge') || github.event.schedule == '25 12-15 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: rotina-ibge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: porteiro
        run: node scripts/agenda.mjs --agora
      - id: indicadores
        if: steps.porteiro.outputs.devido == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/indicadores.mjs --so=ipca
          echo "data=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Abrir pull request
        if: steps.indicadores.outcome == 'success'
        env:
          RESUMO: ${{ steps.porteiro.outputs.resumo }}
        run: |
          scripts/abrir-pr.sh "rotina/ipca-${{ steps.indicadores.outputs.data }}" "IPCA 12 meses atualizado" "O IPCA da faixa de indicadores mudou na fonte do IBGE. Divulgação do dia: ${RESUMO}."

  agenda:
    if: (github.event_name == 'workflow_dispatch' && inputs.rotina == 'agenda') || github.event.schedule == '5 9 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: rotina-agenda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/agenda.mjs --atualizar
      - name: Abrir pull request
        run: |
          scripts/abrir-pr.sh "rotina/agenda-$(TZ=America/Sao_Paulo date +%F)" "Atualiza agenda de divulgações" "Calendário do IBGE renovado para os próximos 60 dias."
